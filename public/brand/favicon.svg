<!--
  md-html-forge · favicon 32×32
  小尺寸下细节会糊，做 3 件事：
    1. 去掉外框（32px 下边框占比太大，挤掉字母内的负空间）
    2. stroke 统一 4，圆角端点
    3. 略微加大火花点，保证 16px 下仍能看见 clay 色
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- 背景圆角方，方便浏览器标签、dock 图标等场景有形 -->
  <rect width="32" height="32" rx="7" fill="#FAF9F5"/>

  <!-- M 的三笔（左竖 / 中竖 / V 谷） -->
  <path d="M6 8 L6 24" stroke="#141413" stroke-width="2.6" stroke-linecap="round"/>
  <path d="M15 8 L15 24" stroke="#141413" stroke-width="2.6" stroke-linecap="round"/>
  <path d="M6 8 L10.5 16 L15 8" stroke="#141413" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- 火花 + 锻造痕 -->
  <circle cx="10.5" cy="16" r="1.5" fill="#D97757"/>
  <path d="M10.5 16 L21.5 16" stroke="#D97757" stroke-width="2.6" stroke-linecap="round"/>

  <!-- H 的两笔 -->
  <path d="M26 8 L26 24" stroke="#141413" stroke-width="2.6" stroke-linecap="round"/>
  <path d="M21.5 16 L26 16" stroke="#141413" stroke-width="2.6" stroke-linecap="round"/>
</svg>
