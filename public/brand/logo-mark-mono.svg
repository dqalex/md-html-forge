<!--
  md-html-forge · Logo mark (monochrome)
  所有描边使用 currentColor，直接通过 color: xxx 控制颜色，适合：
    - 放进浅色 / 深色主题都不用换文件
    - 作为打印 / 盖章用途（单色矢量）
    - 占位 icon / inline svg
  火花同样走 currentColor + opacity，保证降级后不丢语义
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" color="currentColor">
  <rect x="2" y="2" width="60" height="60" rx="12" fill="none" stroke="currentColor" stroke-width="2.5"/>

  <!-- M -->
  <path d="M14 18 L14 46" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
  <path d="M32 18 L32 46" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
  <path d="M14 18 L23 32 L32 18" stroke="currentColor" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- 锻造痕 -->
  <path d="M23 32 L41 32" stroke="currentColor" stroke-width="3" stroke-linecap="round" opacity="0.55"/>
  <circle cx="23" cy="32" r="2.2" fill="currentColor" opacity="0.55"/>

  <!-- H -->
  <path d="M50 18 L50 46" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
  <path d="M41 32 L50 32" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
</svg>
