<!--
  md-html-forge · Logo mark
  ──────────────────────────────────────────
  概念：M（Markdown）→ H（HTML），中间一道 clay 色"锻造痕"
  viewBox 64×64，1.5x stroke 对齐像素网格，适配从 16px 起的各种尺寸
  可直接替换 stroke 颜色使用；当前色 = editorial 主题的 slate + clay
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- 底板：圆角方块 = "一张文档" -->
  <rect x="2" y="2" width="60" height="60" rx="12" fill="#FAF9F5" stroke="#141413" stroke-width="2.5"/>

  <!-- 左半：M 的轮廓（Markdown：三笔，中间的谷比两侧略低） -->
  <!-- 左竖 -->
  <path d="M14 18 L14 46" stroke="#141413" stroke-width="3" stroke-linecap="round"/>
  <!-- 右竖（作为 M 和 H 共享的"中轴") -->
  <path d="M32 18 L32 46" stroke="#141413" stroke-width="3" stroke-linecap="round"/>
  <!-- 斜线：M 的两道谷。左斜从 14↘ 汇到 23,32 再 ↗ 到 32 -->
  <path d="M14 18 L23 32 L32 18" stroke="#141413" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- forge "火花" 痕 = 中间锻造标记，clay 色点睛 -->
  <!-- 一道斜线 + 起点的小圆：暗示"火花从 M 的谷底飞向 H 的横杠" -->
  <path d="M23 32 L41 32" stroke="#D97757" stroke-width="3" stroke-linecap="round"/>
  <circle cx="23" cy="32" r="2.2" fill="#D97757"/>

  <!-- 右半：H 的轮廓（HTML：左竖共享 32, 右竖 50, 中间横 = 锻造痕延长） -->
  <!-- 右竖 -->
  <path d="M50 18 L50 46" stroke="#141413" stroke-width="3" stroke-linecap="round"/>
  <!-- H 的横杠 与锻造痕对齐，但用 slate 色表示"已经固化成 H" -->
  <path d="M41 32 L50 32" stroke="#141413" stroke-width="3" stroke-linecap="round"/>
</svg>
